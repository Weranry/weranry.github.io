        <kbd class="search-kbd">ESC</kbd>
      </div>

        <div class="search-empty">输入关键词搜索文章</div>
      </div>
    </div>

  <script>
  (function() {
    var overlay = document.getElementById('search-overlay');
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    var searchData = null;

    fetch('/search.xml')
      .then(function(r) { return r.text(); })
      .then(function(xml) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(xml, 'text/xml');
        var entries = doc.querySelectorAll('entry');
        searchData = [];
        entries.forEach(function(e) {
          searchData.push({
            title: e.querySelector('title').textContent,
            url: e.querySelector('url').textContent,
            content: (e.querySelector('content') || { textContent: '' }).textContent
          });
        });
      })
      .catch(function() {
        searchData = [];
      });

    function openSearch() {
      overlay.classList.add('active');
      input.value = '';
      input.focus();
      results.innerHTML = '<div class="search-empty">输入关键词搜索文章</div>';
    }

    function closeSearch() {
      overlay.classList.remove('active');
    }

    document.querySelector('.search-toggle').addEventListener('click', openSearch);

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeSearch();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeSearch();
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openSearch();
      }
    });

    input.addEventListener('input', function() {
      var q = input.value.trim().toLowerCase();
      if (!q || !searchData || !searchData.length) {
        results.innerHTML = '<div class="search-empty">' + (searchData ? '未找到结果' : '正在加载搜索数据...') + '</div>';
        return;
      }
      var filtered = searchData.filter(function(item) {
        return item.title.toLowerCase().indexOf(q) > -1 || item.content.toLowerCase().indexOf(q) > -1;
      }).slice(0, 10);
      if (!filtered.length) {
        results.innerHTML = '<div class="search-empty">未找到 "' + q + '" 的结果</div>';
        return;
      }
      var html = '';
      filtered.forEach(function(item) {
        var excerpt = item.content.replace(/<[^>]*>/g, '').substring(0, 150);
        var idx = excerpt.toLowerCase().indexOf(q);
        if (idx > -1) {
          excerpt = excerpt.substring(0, idx) + '<mark>' + excerpt.substring(idx, idx + q.length) + '</mark>' + excerpt.substring(idx + q.length);
        }
        html += '<a class="search-result-item" href="' + item.url + '"><div class="search-result-title">' + item.title + '</div><div class="search-result-excerpt">' + excerpt + '</div></a>';
      });
      results.innerHTML = html;
    });
  })();
  </script>
  

  <script>
  (function() {
    var toggle = document.getElementById('theme-toggle');
    var html = document.documentElement;

    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.setAttribute('data-theme', 'dark');
    }

    toggle.addEventListener('click', function() {
      var current = html.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();
  </script>
